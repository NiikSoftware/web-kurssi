    <main>
        <h1>Ota yhteyttä</h1>
        <p>Jätäthän yhteydenottopyyntösi alla olevaan lomakkeeseen. Otamme sinuun yhteyttä mahdollisimman pian.</p>

        <form class="contact-form" action="#" method="post">
            <label for="name">Nimi</label>
            <input type="text" autocomplete="name" id="name" name="name" required>

            <label for="email">Sähköposti</label>
            <input type="email" autocomplete="email" id="email" name="email" required>

            <label for="phone">Puhelinnumero (Vapaaehtoinen)</label>
            <input type="tel" autocomplete="tel" id="phone" name="phone">

            <label for="message">Viesti</label>
            <textarea id="message" name="message" required></textarea>

            <button type="submit">Lähetä viesti</button>
        </form>

    </main>
