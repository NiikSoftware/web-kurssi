<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kone-Kallio Oy</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <a href="/"><img src="res/logo.png" alt="Kone-Kallio Oy"></a>
        <input type="checkbox" id="nav_mobile_expand">
        <label for="nav_mobile_expand"></label>
        <nav>
            <a href="listing.html" class="disabled_link">Listing</a>
            <a class="nav_divider"></a>
            <a href="contact.html">Contact</a>
            <a href="about.html">About</a>
        </nav>
    </header>
        
    

    <main>
        <h1>Tässä listaus tuotteistamme</h1>

        <noscript>
            <p>This Section requires JavaScript to be Enabled!</p>
        </noscript>

        <img id="load_icon" class="hidden" src="res/load.png" alt="Loading">
        <div id="listing_retry" class="hidden">
            <p>We're busy right now</p>
            <p>Please Wait...</p>
            <button id="retry_machines">Retry</button>
        </div>
        

        <div id="list_main" class="hidden">
            
        </div>



    </main>

    <dialog id="image_viewer" aria-label="Image viewer">
        <img id="image_viewer_image" alt="">
    </dialog>

    <script>
        // huhhuh koko imageviewer on tehty tekoälyllä (ja sitten "korjattu" et mä ite ymmärrän siitä jotain) :D
        const imageViewer = document.getElementById("image_viewer");
        const imageViewerImage = document.getElementById("image_viewer_image");

        function openImageViewer(image) {
            imageViewerImage.src = image.src;
            imageViewerImage.alt = image.alt;
            imageViewer.showModal();
        }

        imageViewerImage.addEventListener("click", () => imageViewer.close());
        imageViewer.addEventListener("click", event => {
            if (event.target === imageViewer) {
                imageViewer.close();
            }
        });

        document.getElementById("retry_machines").addEventListener("click", getMachines);

        async function getMachines() {
            document.getElementById("load_icon").className=""
            document.getElementById("listing_retry").className="hidden"
            try {
                const resp = await fetch("https://vectorsigma.org/briefer/api/v1/items?customer=8");

                if (resp.status == 429) {
                    document.getElementById("load_icon").className="hidden"
                    document.getElementById("listing_retry").className=""

                    return
                }
                else if(!resp.ok) {
                    throw new Error(`Response status: ${resp.status}`);
                }
                

                // Build Objects
                const data = await resp.json();
                const listMain=document.getElementById("list_main")
                const imagePromises = [];

                data["items"].forEach(el => {

                    // <div class="list_item" id="ID">
                    var _obj=document.createElement("div");
                    _obj.className="list_item"
                    _obj.id=el["id"]

                    _el=undefined
                    _el2=undefined

                    // <img alt="NAME" src="machines/ID.png">
                    _el=document.createElement("img");
                    _el.alt=el["name"]
                    let usedPlaceholder = false;
                    imagePromises.push(new Promise(resolve => {
                        _el.onload = resolve;
                        _el.onerror = function() {
                            if (usedPlaceholder) {
                                resolve();
                                return;
                            }

                            usedPlaceholder = true;
                            this.src = "machines/placeholder.jpg";
                        };
                    }));
                    _el.src="machines/"+el["id"]+".jpg"
                    const machineImage = _el;
                    machineImage.addEventListener("click", () => openImageViewer(machineImage));
                    _obj.appendChild(_el)

                    // <div class="list_item_name">NAME</div>
                    _el=document.createElement("div")
                    _el.className="list_item_name"
                    _el.textContent = el["name"]
                    _obj.appendChild(_el)

                    // <div class="list_item_info">
                    _el=document.createElement("div")
                    _el.className="list_item_info"

                    // <div>Tyyppi</div>
                    _el2=document.createElement("div")
                    _el2.textContent="Tyyppi"
                    _el.appendChild(_el2)

                    // <div>TYPE NAME</div>
                    _el2=document.createElement("div")
                    //_el2.style="color:black"
                    _el2.textContent=el["type"].charAt(0).toUpperCase() + el["type"].slice(1) // hehee
                    _el.appendChild(_el2)
                    _obj.appendChild(_el)

                    // <div class="list_item_info">
                    _el=document.createElement("div")
                    _el.className="list_item_info"

                    // <div>Weight</div>
                    _el2=document.createElement("div")
                    _el2.textContent="Paino"
                    _el.appendChild(_el2)

                    // <div>WEIGHT Kg</div>
                    _el2=document.createElement("div")
                    _el2.textContent=el["weight_kg"]+" Kg"
                    _el.appendChild(_el2)
                    _obj.appendChild(_el)

                    // <div class="list_item_footer">
                    _el=document.createElement("div")
                    _el.className="list_item_footer"

                    // <div class="list_item_price">26,21€</div>
                    _el2=document.createElement("div")
                    _el2.className="list_item_price"
                    _el2.textContent=el["price_day"]+"€"
                    _el.appendChild(_el2)

                    // <div class="list_item_price_perday">/Päivä</div>
                    _el2=document.createElement("div")
                    _el2.className="list_item_price_perday"
                    _el2.textContent="/Päivä"
                    _el.appendChild(_el2)

                    // <div class="list_item_check_available">Tarkista Saatavuus</div>
                    _el2=document.createElement("div")
                    _el2.className="list_item_check_available"
                    _el2.textContent="Tarkista Saatavuus"
                    _el.appendChild(_el2)

                    _obj.appendChild(_el)

                    listMain.appendChild(_obj);
                });
                await Promise.all(imagePromises);
                listMain.className = "";
                document.getElementById("load_icon").className="hidden"
                
            } catch (error) {
                console.error(error);
                // Handle error here
            }
        }

        getMachines()
    </script>


    <footer>
        <div>Kone-Kallio Oy</div>
        <a target="_blank" class="address_link" href="https://www.google.com/maps/place/Pee+Pee+Creek/@39.154898,-83.1310169,13484m">Konetie 2, 61300 Kurikka</a>
        <div></div>
        <br>
        <div>Aukioloajat:</div>
        <div>Ma-Pe: 7-17</div>
        
        <br>
        <div>Website by
            <a target="_blank" href="https://niiksoftware.com" class="niik_link">Niik Software</a> | 
            <a target="_blank" href="PrivacyPolicy.html" class="niik_link">Privacy Policy</a></div>
    </footer>

</body>
</html>
